<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for your submission">
    <title>Thank You</title>
    <link rel="stylesheet" href="thankyou.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="thankyou-container">
        <div class="thankyou-card">
            <div class="icon-wrapper">
                <svg class="success-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h1 class="thankyou-title">Thank You!</h1>
            <p class="thankyou-description">
                We truly appreciate your time and effort. Your submission has been received successfully. We'll be in touch shortly with the next steps.
            </p>
            <a href="/" class="back-button" role="button" aria-label="Return to homepage">
                Back to Home
            </a>
        </div>
    </main>
</body>
</html>
